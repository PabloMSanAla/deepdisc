[project]
name = "deepdisc"
version = "0.1.0"
description = ""
authors = [
    {name = "PabloMSanAla",email = "pablom.sanala@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "keras (>=3.12.0,<4.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "scikeras (>=0.13.0,<0.14.0)",
